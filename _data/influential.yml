- img: "3-518-36579-7"
  title: "Das Glasperlenspiel"
  added: 2024-07-14
  description: >-
    Die Komplexität und Vielseitigkeit der Erzählung und der Charaktere hat mich sehr beeindruckt. Die Art, wie das Buch ein Leben von Anfang bis Ende umfasst, und das Gedicht, das dieses Leben beschreibt, haben mich zum ersten Mal begreifen lassen, warum Menschen Gedichte so wertschätzen. Das Buch hat mich wirklich sehr berührt und beschäftigt - ich kann nicht genau sagen, warum. Es hat mich beispielsweise dazu gebracht, sporadisch Tagebuch zu führen, um ein besseres Gefühl dafür zu bekommen, wie sehr ich mich verändere.
  description_en: >-
    AI-translated by Gemini 3 Flash
    I was deeply impressed by the complexity and multifaceted nature of the narrative and its characters. The way the book spans a life from beginning to end, and the poem describing that life, made me understand for the first time why people cherish poetry so much. The book truly touched and moved me—I can't say exactly why. For instance, it inspired me to start keeping a sporadic diary to get a better sense of how much I change over time.
  book: true


- img: "978-3-257-22535-8"
  title: "Der Richter und sein Henker"
  added: 2024-06-14
  book: true
  description: >-
    Ich bin ein großer Dürrenmatt-Fan und finde, dies ist sein bestes Werk. Der Gegensatz zwischen einem absoluten, morallos nihilistischen Charakter und dem von diesem besessenen Polizisten ist brilliant. Insbesondere die Frage, wie weit er geht, um sein Lebensziel zu erreichen, fasziniert mich.
  description_en: >-
    AI-translated by Gemini 3 Flash
    I'm a big Dürrenmatt fan and I think this is his best work. The contrast between an absolute, amoral nihilistic character and the policeman who is obsessed with him is brilliant. In particular, the question of how far he will go to achieve his life's goal fascinates me.

- img: "978-0-140-07615-8"
  title: "Flatland: A Romance of Many Dimensions by A. Square"
  added: 2025-12-25
  book: true
  description: >-
    KI übersetzt mit Gemini 3 Flash
    Dieses Buch erreicht auf beeindruckende Weise zwei Dinge, die den Leser dazu einladen, die Grenzen seiner Wahrnehmung zu hinterfragen: Erstens ist es eine Satire auf die viktorianische Gesellschaft; obwohl ich die Qualität oder Genauigkeit dieser Satire nicht beurteilen kann, ist es dennoch faszinierend, ein Werk zu lesen, das sich an eine Welt richtet, die nicht mehr existiert. Auf diese Weise bietet der Roman ein neues Fenster zu einer Kultur, die uns sonst unverständlich ist, und er tut dies auf eine unkonventionelle Weise. Die zweite Errungenschaft besteht darin, dass der Großteil der Geschichte im zweidimensionalen Raum spielt und damit unsere Wahrnehmung der Realität herausfordert. Es zeigt anschaulich, wie unvorstellbar der dreidimensionale Raum für ein zweidimensionales Wesen wäre, und verdeutlicht damit unsere eigene Schwierigkeit, Dimensionen jenseits der vertrauten drei zu visualisieren.
  description_en: >-
    This book impressively achieves two things, both inviting the reader to reconsider the limits of their perception:  First, it is a satire of Victorian society; while I cannot judge the quality or accuracy of that satire, it is nonetheless fascinating to read a work aimed at a world that no longer exists. In this way the novel offers a new window onto a culture that is otherwise unintelligible to us, and it does so in an unconventional manner. The second achievement is that most of the story takes place in two‑dimensional space, thereby challenging the way we perceive reality. It vividly shows how unimaginable three‑dimensional space would be to a 2‑D creature, and, by extension, highlights our own difficulty in visualising dimensions beyond the familiar three.

- img: "978-3-548-06041-5"
  title: "Factfullness"
  book: true
  added: 2026-04-01
  description: >-
    Das Buch hat mich sehr beeindruckt, weil es wie wenige Bücher versucht am global-gesellschaftlichen Gesamtbild zu rütteln und das auch gut schaft. Man darf das Buch nicht missverstehen als "Alles wird besser, macht nur so weiter" (als Beispiel nennt das Buch den immer noch sehr relevanten, aber leider aus dem Diskussionalltag verschwundenen Klimawandel (bei dem aber auch Dinge passieren, siehe Speicherausbau)), sondern stattdessen als Korrekturbrille, die (wenn man es so lesen will) es erst ermöglicht zielgerichtet an Schwachstellen zu arbeiten. Ganz entschieden tritt er dabei auch immer dem Bild des "Wir müssen den Armen in XY" helfen entgegen und betont anekdotische deren eigene Perspektive und vorallem Ausblick. Die ersten Kapitel ziehen sich zwar etwas, insbesondere wenn man schon ein wenig Verständnis für das lesen von Statistiken hat, aber danach ist es wirklich Gold wert! Insbesondere hat es mir auch noch mal mit der (in meinem "Milieu" sehr verbreiteten) Kapitalismuskritik zu denken gegeben. Kapitalismus kann sehr gut Skaleneffekte nutzbar machen und das eben auch im Bereich Infrastruktur und Lebensqualität. Dabei geht es natürlich nicht um einen Manchesterkapitalismus und das Buch ist kein Plädoyer für Kapitalismus per se, aber zeigt doch eindrucksvoll das man in manchen Dingen die Kraft des "aktuellen" Systems unterschätzt (solange es Impulse (bspw. Förderung) in die richtige Richtung und keine *brutale* Unterdrückung gibt). Muss ich auf jeden Fall noch mal mehr drüber nachdenken. Zentrales Element ist dabei immer der Nachweis das es nicht "wir" und "die" gibt, sondern es viel mehr ein fließender Übergang in bspw. Lebensqualität ist. Spannend fände ich es die Autoren zu fragen, wie sie es den Ertragen können das Kinderarbeit und schreckliche Arbeitsbedingungen bei uns billige Kleider produzieren. Ich nehme an, die Antwort wäre in etwa "Natürlich ist das schrecklich, aber hoffentlich ist das nur eine kurze Zwischenstufe, die diese Länder schneller durchlaufen, als unsere eigenen Länder es haben." Und wenn das wirklich stimmt, dann rechtfertigt das immer noch nicht den Kauf billiger Kleidung (man könnte das ja noch mehr beschleunigen), aber senkt hoffentlich mittelfristig die Anzahl der Menschen in extremer Armut auf nahe 0. Ich merke ich habe noch einige Dissonanzen zwischen dem Buch und meinem Weltbild (und auch diesem Text), aber ich werde mich langsam an ihnen abarbeiten. Apropo: Ich finde hierbie übertreibt das Buch immer mal wieder und arbeitet sich an Journalisten und "den Medien" ab.
  description_en: >-
    AI-translated with Gemini 3 Flash
    This book deeply impressed me because, like few others, it attempts to shake up the global societal picture and succeeds in doing so. One shouldn't misunderstand the book as "Everything is getting better, just keep it up" (as an example, the book mentions climate change, which is still highly relevant but has unfortunately faded from daily discussion (though things are happening there, like storage expansion)), but rather as a set of corrective lenses that (if one chooses to read it that way) first makes it possible to work purposefully on weak points. He also very decisively opposes the image of "We must help the poor in XY" and instead emphasizes their own perspective and, above all, outlook through anecdotes. The first few chapters drag a bit, especially if you already have some understanding of reading statistics, but after that, it's truly worth its weight in gold! In particular, it made me rethink the critique of capitalism (very common in my "milieu"). Capitalism can utilize economies of scale very effectively, even in the areas of infrastructure and quality of life. This isn't about "Manchester capitalism," and the book is no plea for capitalism per se, but it impressively shows how the power of the "current" system is underestimated in some things (as long as there are impulses like subsidies in the right direction and no *brutal* suppression). I definitely need to think more about this. A central element is always the proof that there is no "us" and "them," but rather a fluid transition in, for example, quality of life. I'd be curious to ask the authors how they can bear that child labor and terrible working conditions produce cheap clothes for us. I assume the answer would be something like, "Of course it's terrible, but hopefully it's just a short intermediate stage that these countries pass through faster than our own countries did." And if that's really true, it still doesn't justify buying cheap clothes (one could accelerate the process even more), but hopefully it will reduce the number of people in extreme poverty to near zero in the medium term. I notice I still have some dissonances between the book and my worldview (and also this text), but I will slowly work through them. By the way: I think the book overdoes it every now and then by lashing out at journalists and "the media."

- img: "978-0-470-22905-7"
  title: "The Annotated Turing"
  added: 2024-12-01
  book: true
  description: >-
    KI übersetzt von Gemini 3 Flash
    <br>
    Dieses Buch macht Turings Originalarbeit sehr zugänglich. Es ist extrem interessant, die Wurzeln eines fundamentalen Konzepts der Informatik zu sehen. Besonders die Unterschiede zwischen den „ursprünglichen“ Turing-Maschinen und den Turing-Maschinen, wie sie in meinen Vorlesungen verwendet wurden, waren faszinierend.

    Die Maschinen, an denen Turing interessiert ist, sind „kreisfrei“, was insbesondere bedeutet, dass sie niemals anhalten oder in abwechselnden Schreibvorgängen stecken bleiben, sondern eine Zahl ewig weiterschreiben. Zum Beispiel eine Maschine, die unendlich pi schreibt. Während die Turing-Maschinen, an die ich gewöhnt bin, anhalten und algorithmische Probleme lösen sollen, anstatt „nur“ Zahlen zu berechnen.

    Das Buch zeigt die Ursprünge des Lambda-Kalküls und die historischen Hintergründe dieser Konzepte (wie die beteiligten Personen und Arbeiten). Es berührt auch andere Grundlagen wie die Prädikatenlogik erster Stufe und den Unterschied zwischen Intuitionisten und Formalisten.

    Im Gegensatz zu vielen Erklärungen von Turings Errungenschaften lieferte dies eine wirkliche Erklärung. Die meisten anderen Erklärungen lassen nicht nur den Übergang zwischen Turing-Maschinen und Prädikatenlogik sowie Turings Argumentation, dass Turing-Maschinen tatsächlich das tun, was unter „Rechnen“ verstanden wird, weg – sie verschweigen auch, dass eigentlich Alonzo Church der Erste war, der zeigte, dass es keine allgemeinen Konzepte gibt, um alle algebraischen Probleme zu lösen.

    Es hat mich auch dazu gebracht, mit dem Konzept der reellen Zahlen und ihrer Nützlichkeit (im Gegensatz zu berechenbaren Zahlen) und dem Satz vom ausgeschlossenen Dritten zu ringen. Ich kämpfe immer noch darum, wieder festen Boden unter den Füßen zu finden, aber es hat definitiv mein Verständnis dafür erweitert, was Zahlen eigentlich sind und wie seltsam das Kontinuum ist.
  description_en: >-
   This book makes Turing's original paper very accessible. It is extremely interesting to see the roots of a fundamental concept of computer science. Especially the differences between the 'original' Turing machines and Turing machines as used in my lectures were fascinating.

   The machines Turing is interested in are 'circle free', meaning in particular they never halt or get stuck in alternating writes but continue to write a number forever. For instance, a machine for ever writing pi. While the Turing machines I am used to are supposed to halt and solve algorithmic problems, instead of 'merely' computing numbers.

   The book showed the origins of lambda calculus and the historical backgrounds of these concepts (such as the people and the papers involved). It also touched on other foundations such as first-order logic and the difference between intuitionists and formalists.

   In contrast to all explanations of Turing's achievements, this provided an actual explanation. Not only do most other explanations leave out the transition between Turing machines and first-order logic and Turing's argumentation that Turing machines actually do what is considered as 'computing', but they also leave out that actually Alonzo Church was the first to show there are no general concepts to solve all algebraic problems.

   It also caused me to struggle with the concept of real numbers and their usefulness (as opposed to computable numbers) and the law of excluded middle. I am still struggling to regain my footing, but it definitely extended my grasp on what numbers actually are and how weird the continuum is.

- img: "978-0-55299704-1"
  title: "A short history of nearly everything"
  book: true
  description: >-
    KI übersetzt von Gemini 3 Flash
    Obwohl es schon eine Weile her ist, dass ich dieses Buch gelesen habe, erinnere ich mich noch immer daran, wie beeindruckt ich von der schieren Bandbreite der behandelten Themen war, aber auch davon, wie jede noch so trocken erscheinende wissenschaftliche Disziplin als etwas zutiefst Interessantes erscheint. Ich kann dieses Buch wirklich sowohl als gute Lektüre als auch als Funken für ein allgemeines Interesse an vielen Themen empfehlen.
  description_en: >-
    While it has been a while that I read this book, I still remember how impressed I was from the sheer range of topics covered but also how every seemingly dull scientific discipline appears as something thorougly interesting. I can really recommend this book both as a good read and to spark general interest in many topics.

- img: "978-0-141-39546-3"
  tittle: "Essays by George Orwell"
  book: true
  description: >-
    KI übersetzt von Gemini 3 Flash
    Während viele der in diesem Buch aufgeführten Essays für Leser, die mit den britischen Schriftstellern des 20. Jahrhunderts nicht vertraut sind, nicht so interessant sind, finden sich dennoch viele, viele ausgezeichnete und zum Nachdenken anregende Essays: „My country left or right“, „The lion and the unicorn“, „Antisemitism in Britain“ und „Notes on Nationalism“, um nur einige zu nennen. Oft bieten sie eine andere Perspektive auf die Gesellschaft und das Leben des Einzelnen oder interessante autobiografische Details. Besonders interessiert hat mich die Lektüre der Aufsätze, die während oder über den Zweiten Weltkrieg geschrieben wurden und in denen George Orwells Ringen um sein Verhältnis zu Großbritannien deutlich wird.
  description_en: >-
    While many essays listed in this book are not that interesting for the readers not familiar with British 20. century writers there are sill many many excellent and thoughtprovoking essays to be found: My country left or right, The lion and the unicorn, Antisemitism in Britain and Notes on Nationalism to name just a few. Often posing a different perspective on society and the life of the individual or interesting autobiographical details. I was especially interested in reading the Essays written about or during WWII in which George Orwells struggle on his relationship to Britain can be seen.

- img: "https://images.igdb.com/igdb/image/upload/t_cover_big/co2una.webp"
  link: "https://www.igdb.com/games/horizon-zero-dawn"
  title: "Horizon Zero Dawn"
  added: 2025-12-01
  description: >-
    Ich glaube, was mich daran am meisten fasziniert hat, ist das für mich völlig neue Medienformat. Zwar habe ich durchaus immer wieder Computerspiele gespielt, aber nie eines, das eine Geschichte erzählen wollte. Das tut Horizon Zero Dawn in beeindruckender Weise, in allen Facetten: Sprache, Mimik, Kleidung, Umgebung und Wetter. Hinzu kommt, dass man frei entscheiden kann, was einen interessiert: Ob man über die Lebensweise dieses Volkes mehr lernen möchte oder die Geschichte dieser Person – oder eben auch nicht.

    Die Erzählweise ist unglaublich packend und vielschichtig; sie schafft es wirklich gut zu erklären, warum die Welt im Spiel so ist, wie sie ist. Auch wenn die Geschichte selbst sehr unwahrscheinlich wird, da das Spielkonzept es nötig macht, dass „alles“ nur von einer einzigen Person erreicht wird – nämlich dem Charakter des Spielers.

    Horizon Zero Dawn ist wahrscheinlich schon ein sehr gutes Spiel dieses Typs, weshalb ich auch von einem Freund dazu überzeugt wurde. Ehrlicherweise muss man jedoch sagen, dass meine Faszination für dieses Spiel zu einem großen Teil daherkommt, dass mir der Typus eines solchen Spiels nicht bekannt war. Ein genauso gutes Spiel, das ich jetzt spiele, würde mich wahrscheinlich nicht mehr so stark faszinieren.

    Ich kann es allen Menschen empfehlen, die an neuen Wegen interessiert sind, Geschichten zu erzählen.
  description_en: >-
    AI-translated by Gemini 3 Flash
    I think what fascinated me most about it is the completely new media format for me. Although I have certainly played computer games from time to time, I had never played one that aimed to tell a story. Horizon Zero Dawn does this in an impressive way, in all its facets: language, facial expressions, clothing, environment, and weather. Additionally, you can freely decide what interests you: whether you want to learn more about the lifestyle of these people or the history of this person—or not.

    The storytelling is incredibly gripping and multi-layered; it manages very well to explain why the world in the game is the way it is. Even if the story itself becomes very improbable, as the game concept makes it necessary for "everything" to be achieved by a single person—namely the player's character.

    Horizon Zero Dawn is probably already a very good game of this type, which is why I was convinced to play it by a friend. Honestly, however, my fascination for this game stems largely from the fact that I was unfamiliar with this type of game. An equally good game that I play now would probably no longer fascinate me as much.

    I can recommend it to all people who are interested in new ways of telling stories.

